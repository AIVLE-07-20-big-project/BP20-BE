spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:bp20-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: bp20-test-secret-key-with-at-least-32-characters
    expiration-seconds: 7200
    admin-expiration-seconds: 900
  auth:
    refresh-token:
      store: memory
      expiration-seconds: 604800
      remember-me-expiration-seconds: 2592000
      cookie-name: bp20_refresh_token
      cookie-secure: false
      cookie-same-site: Lax
  iam:
    invitation-expiration-hours: 24
  cors:
    allowed-origins: http://localhost:3000
  fastapi:
    base-url: http://localhost:8000
  security:
    personal-data:
      encryption-key: bp20-test-personal-data-key-with-at-least-32-characters

ai:
  server-url: http://localhost:8000
  effect-verification:
    base-url: http://localhost:8000
  review-sentiment:
    base-url: http://localhost:8000

ocr-service:
  base-url: http://localhost:8000

# ImageStorageConfig가 StorageProperties(product-image-storage.*)를 필수로 주입받는데
# 이 섹션이 없으면 properties.s3()가 null이 되어 컨텍스트 로딩 시 NPE 발생 (전 테스트 연쇄 실패 원인)
product-image-storage:
  local:
    dir: build/test-uploads/product-images
    base-url: http://localhost:8080/product-images
  s3:
    bucket:
    region: ap-northeast-2

llm:
  server-url: http://localhost:8001

weather:
  api:
    service-key: test-kma-service-key
    asos-hourly-url: https://example.invalid/asos

kma:
  forecast-url: https://example.invalid/forecast
