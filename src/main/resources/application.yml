spring:
  application:
    name: backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  main:
    web-application-type: servlet

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false

server:
  port: 8080
  forward-headers-strategy: framework

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: info
    com.bp20: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true
  show-actuator: true

# 기상청 단기예보 및 과거 ASOS 날씨
weather:
  api:
    service-key: ${KMA_SERVICE_KEY}
    asos-hourly-url: https://apis.data.go.kr/1360000/AsosHourlyInfoService/getWthrDataList

kma:
  forecast-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst

kakao:
  local:
    base-url: https://dapi.kakao.com
    rest-api-key: ${KAKAO_REST_API_KEY:}

# 발주량 예측 및 효과검증 AI 서비스
ai:
  server-url: ${AI_SERVER_URL:http://localhost:8000}
  effect-verification:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  review-sentiment:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}

# 영수증 OCR 및 원가 분석 서비스
ocr-service:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}

# AI 상품 이미지 생성 서비스 연동 설정
product-image-service:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS}
    admin-expiration-seconds: ${JWT_ADMIN_EXPIRATION_SECONDS}
  auth:
    refresh-token:
      store: ${REFRESH_TOKEN_STORE:redis}
      expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
      remember-me-expiration-seconds: ${REFRESH_TOKEN_REMEMBER_ME_EXPIRATION_SECONDS:2592000}
      cookie-name: ${REFRESH_TOKEN_COOKIE_NAME:bp20_refresh_token}
      cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
      cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
  iam:
    invitation-expiration-hours: ${INVITATION_EXPIRATION_HOURS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
