spring:
  application:
    name: backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  main:
    web-application-type: servlet

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false

storage:
  s3:
    bucket: ${S3_BUCKET_NAME:}
    region: ${AWS_REGION:ap-northeast-2}
    upload-prefix: ${UPLOAD_S3_PREFIX:uploads/v1}

server:
  port: 8080
  forward-headers-strategy: framework

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: info
    com.bp20: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true
  show-actuator: true

# 기상청 단기예보 및 과거 ASOS 날씨
weather:
  api:
    service-key: ${KMA_SERVICE_KEY}
    asos-hourly-url: https://apis.data.go.kr/1360000/AsosHourlyInfoService/getWthrDataList

kma:
  forecast-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst

kakao:
  local:
    base-url: https://dapi.kakao.com
    rest-api-key: ${KAKAO_REST_API_KEY:}

# 발주량 예측 및 효과검증 AI 서비스
ai:
  server-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  effect-verification:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  review-sentiment:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}

effect-verification:
  scheduler:
    enabled: ${EFFECT_VERIFICATION_SCHEDULER_ENABLED:true}
    cron: ${EFFECT_VERIFICATION_SCHEDULER_CRON:0 0 2 * * *}
    zone: ${EFFECT_VERIFICATION_SCHEDULER_ZONE:Asia/Seoul}
    max-attempts: ${EFFECT_VERIFICATION_MAX_ATTEMPTS:3}

review-analysis:
  scheduler:
    enabled: ${REVIEW_ANALYSIS_SCHEDULER_ENABLED:true}
    fixed-delay-ms: ${REVIEW_ANALYSIS_SCHEDULER_FIXED_DELAY_MS:60000}
    initial-delay-ms: ${REVIEW_ANALYSIS_SCHEDULER_INITIAL_DELAY_MS:60000}
# 신규 가맹점 영업 타겟 배치 — AI_Agent_전환_가이드라인.md 4단계(운영 정리 정책).
# stale-days일 이상 관리자가 승인/반려하지 않고 방치한 배치를 자동 반려한다.
sales-target:
  batch-cleanup:
    enabled: ${SALES_TARGET_BATCH_CLEANUP_ENABLED:true}
    cron: ${SALES_TARGET_BATCH_CLEANUP_CRON:0 0 3 * * *}
    zone: ${SALES_TARGET_BATCH_CLEANUP_ZONE:Asia/Seoul}
    stale-days: ${SALES_TARGET_BATCH_CLEANUP_STALE_DAYS:3}

# 영수증 OCR 및 원가 분석 서비스
ocr-service:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}

# AI 상품 이미지 생성 서비스 연동 설정
product-image-service:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}

# AI 서버 -> BE 내부 API 인증키 (신규 가맹점 영업 타겟 추천용 자사 가맹점 레지스트리 조회)
internal-api:
  key: ${INTERNAL_API_KEY}

# 생성된 상품 이미지 저장소. product-image-storage.s3.bucket이 설정되어 있으면 S3,
# 없으면 로컬 디스크에 저장한다. (storage.s3.*는 main이 추가한 범용 오브젝트 스토리지 전용이라
# 이름 충돌을 피하려고 별도 네임스페이스를 쓴다.)
product-image-storage:
  local:
    dir: ${STORAGE_LOCAL_DIR:uploads/product-images}
    base-url: ${STORAGE_LOCAL_BASE_URL:http://localhost:8080/product-images}
  s3:
    bucket: ${STORAGE_S3_BUCKET:}
    region: ${STORAGE_S3_REGION:ap-northeast-2}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS}
    admin-expiration-seconds: ${JWT_ADMIN_EXPIRATION_SECONDS}
  auth:
    account-security:
      password-max-age-days: ${PASSWORD_MAX_AGE_DAYS:90}
      max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
      account-lock-minutes: ${ACCOUNT_LOCK_MINUTES:15}
    captcha:
      enabled: ${CAPTCHA_ENABLED:false}
      secret-key: ${CAPTCHA_SECRET_KEY:}
      verify-url: ${CAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
      minimum-score: ${CAPTCHA_MIN_SCORE:0.5}
      expected-action: ${CAPTCHA_EXPECTED_ACTION:login}
      allowed-hostnames: ${CAPTCHA_ALLOWED_HOSTNAMES:}
    refresh-token:
      store: ${REFRESH_TOKEN_STORE:redis}
      expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
      remember-me-expiration-seconds: ${REFRESH_TOKEN_REMEMBER_ME_EXPIRATION_SECONDS:2592000}
      cookie-name: ${REFRESH_TOKEN_COOKIE_NAME:bp20_refresh_token}
      cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
      cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
  iam:
    invitation-expiration-hours: ${INVITATION_EXPIRATION_HOURS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  security:
    personal-data:
      encryption-key: ${PERSONAL_DATA_ENCRYPTION_KEY:${JWT_SECRET}}
