spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:true}

storage:
  s3:
    bucket: ${S3_BUCKET_NAME}
    region: ${AWS_REGION:ap-northeast-2}
    upload-prefix: ${UPLOAD_S3_PREFIX:uploads/v1}

product-image-storage:
  s3:
    bucket: ${STORAGE_S3_BUCKET}
    region: ${STORAGE_S3_REGION:ap-northeast-2}

logging:
  level:
    root: info
    com.bp20: info
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS}
    admin-expiration-seconds: ${JWT_ADMIN_EXPIRATION_SECONDS}
  auth:
    refresh-token:
      cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
      cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
  iam:
    invitation-expiration-hours: ${INVITATION_EXPIRATION_HOURS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  fastapi:
    base-url: ${FASTAPI_BASE_URL}
  security:
    personal-data:
      encryption-key: ${PERSONAL_DATA_ENCRYPTION_KEY}
